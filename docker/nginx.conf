server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA deep links (/store/p/:slug, /backoffice/...) resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets are immutable; the worker and HTML must never be stale-cached.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /mockServiceWorker.js {
    add_header Cache-Control "no-cache";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
