packages:
  - 'packages/*'
  - 'apps/*'

# Dependencies allowed to run install/build scripts (pnpm blocks these by default).
# esbuild powers tsx + Vite; msw scaffolds its worker tooling; oxide is Tailwind v4's
# native engine.
allowBuilds:
  esbuild: true
  msw: true
  '@tailwindcss/oxide': true

minimumReleaseAgeExclude:
  - tsx@4.22.5
