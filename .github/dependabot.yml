version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 does not expose the compiler API required by
      # typescript-eslint. Revisit once the ecosystem supports the new API.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # Keep the bundler and its React plugin on the same PR — their majors are
      # coupled (a plugin major can require a newer Vite), so bumping them apart
      # produces incompatible PRs.
      vite:
        patterns:
          - vite
          - '@vitejs/*'
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
