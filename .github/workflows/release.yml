name: Release

# Fires on a version tag (vX.Y.Z). Publishes the container image to GHCR and
# deploys the static build to the live target. Cut a release with:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ['v*.*.*']

jobs:
  # Run the full CI gate (format, lint, typecheck, build, Playwright) before
  # anything ships — a tag must not deploy code that main wouldn't accept.
  verify:
    uses: ./.github/workflows/ci.yml

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and a
    # Cloudflare Pages project named "simulator". Set these before the first tag.
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (static site)
        run: pnpm run build

      # wrangler-action installs wrangler with a workspace-root `pnpm add`, which
      # pnpm rejects — so invoke wrangler directly via npx instead.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy apps/site/dist --project-name=simulator --branch=main
